name: supply-chain-demo

# Mirrors the SDLC build step twice, IDENTICALLY, changing ONLY the registry the
# pipeline resolves dependencies from:
#
#   Job A (unprotected) -> public npm registry        -> real deps build AND the
#                                                         malicious package installs;
#                                                         build goes GREEN -> malware ships.
#   Job B (protected)   -> JFrog virtual repo -> CGR  -> real deps still build fine,
#                                                         but the malicious package is
#                                                         WITHHELD -> build FAILS (the gate).
#
# Same code, same steps, same developer action. Only .npmrc differs.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   JFROG_NPM_REGISTRY   https://chainguardlibraries.jfrog.io/artifactory/api/npm/andrewgc-jscript/
#   JFROG_NPM_AUTH_HOST  chainguardlibraries.jfrog.io/artifactory/api/npm/andrewgc-jscript   (no scheme, no trailing slash)
#   JFROG_TOKEN          Artifactory identity token (the npm _authToken value)

on:
  workflow_dispatch:
    inputs:
      malware_package:
        description: "Malware to attempt (MUST still be live on public npm AND flagged by Chainguard)"
        required: true
        type: choice
        default: "agent-dag@1.35.12"
        options:
          # agent-dag@1.35.12 -- STILL LIVE on npm + MALWARE_DETECTED by Chainguard (113 versions withheld).
          # This is the reliable default: Job A installs it, Job B gets a clean 403 MALWARE_DETECTED.
          - "agent-dag@1.35.12"
          # NOTE on axios: axios@1.14.1 / 0.30.4 (Mar 2026 maintainer-account hijack, injects a RAT,
          # MAL-2026-2307) are a GREAT story but were YANKED from npm within hours. They now ETARGET
          # ("version doesn't exist") in BOTH jobs -- npm never reaches the tarball, so no 403 fires.
          # Keep axios as a talk-track example only; do NOT add it here as a runnable option.
      custom_package:
        description: "Optional: override with any package[@version] (leave blank to use the dropdown)"
        required: false
        default: ""

# Free-form custom_package wins when provided; otherwise use the dropdown choice.
env:
  PKG: ${{ github.event.inputs.custom_package != '' && github.event.inputs.custom_package || github.event.inputs.malware_package }}

jobs:
  unprotected-public-npm:
    name: "A · Unprotected (public npm)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the app from PUBLIC npm
        run: |
          rm -f package-lock.json
          npm install --registry=https://registry.npmjs.org/
      - name: A developer adds a dependency — from public npm, nothing stops it
        run: |
          # --ignore-scripts so real malware does NOT execute install hooks on the runner
          npm install "${{ env.PKG }}" \
            --registry=https://registry.npmjs.org/ \
            --ignore-scripts
      - name: Result
        run: |
          echo "::warning::'${{ env.PKG }}' resolved from public npm — build is GREEN and the malicious dependency has shipped into the SDLC."

  protected-chainguard:
    name: "B · Protected (JFrog virtual repo -> Chainguard)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Point the build at the Chainguard-backed registry
        run: |
          cat > .npmrc <<EOF
          registry=${{ secrets.JFROG_NPM_REGISTRY }}
          //${{ secrets.JFROG_NPM_AUTH_HOST }}/:_authToken=${{ secrets.JFROG_TOKEN }}
          always-auth=true
          EOF
      - name: Build the app through Chainguard — real deps resolve normally
        run: |
          rm -f package-lock.json
          npm install
      - name: Same developer adds the same dependency — Chainguard blocks it
        run: |
          set +e
          out=$(npm install "${{ env.PKG }}" --ignore-scripts 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::'${{ env.PKG }}' was NOT blocked — it installed. Check that the virtual repo has NO public-npm remote ahead of the Chainguard remote; a stray fallback silently serves the malware."
            exit 1
          fi
          if echo "$out" | grep -qiE "MALWARE_DETECTED|blocked by Chainguard for malware"; then
            echo "::notice::BLOCKED — Chainguard returned HTTP 403 MALWARE_DETECTED for '${{ env.PKG }}'. The pipeline is stopped and the malicious package never entered the SDLC."
          else
            echo "::error::Install failed (exit $code) but WITHOUT a Chainguard malware verdict. Do not claim a malware block — investigate auth / network / cooldown / 404 first."
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: rm -f .npmrc
