name: branch-registry-demo

# Branch-driven demo: this workflow resolves dependencies using THIS BRANCH'S
# committed .npmrc, so the outcome flips with the branch:
#
#   main       -> .npmrc = public npm      -> malware INSTALLS -> GREEN (shipped, silent)
#   chainguard -> .npmrc = JFrog -> CGR    -> malware BLOCKED (403) -> RED (stopped, loud)
#
# Each run writes a report to the job summary (top of the run page), not just
# annotations, so the outcome is obvious on screen.
#
# Requires secret JFROG_TOKEN (for ${JFROG_TOKEN} expansion in the chainguard .npmrc).

on:
  workflow_dispatch:
    inputs:
      malware_package:
        description: "Malware to attempt (must be live on npm AND flagged by Chainguard)"
        required: true
        type: choice
        default: "agent-dag@1.35.12"
        options:
          - "agent-dag@1.35.12"
      custom_package:
        description: "Optional: override with any package[@version]"
        required: false
        default: ""

env:
  PKG: ${{ github.event.inputs.custom_package != '' && github.event.inputs.custom_package || github.event.inputs.malware_package }}
  JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

jobs:
  install-via-branch-registry:
    name: "Install via this branch's .npmrc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Which registry does this branch resolve from?
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "----- .npmrc -----"
          cat .npmrc 2>/dev/null || echo "(no .npmrc; npm default)"
          echo "----- effective registry -----"
          npm config get registry
      - name: Build the app using this branch's registry
        run: |
          rm -f package-lock.json
          npm install
      - name: Developer adds a dependency — outcome depends on the registry
        run: |
          REG=$(npm config get registry)
          set +e
          out=$(npm install "${{ env.PKG }}" --ignore-scripts 2>&1)
          code=$?
          set -e
          echo "$out"

          {
            echo "## Supply-chain demo — branch \`${{ github.ref_name }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Registry | \`$REG\` |"
            echo "| Package | \`${{ env.PKG }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -eq 0 ]; then
            {
              echo "| Result | ⚠️ **INSTALLED** — malware shipped (build is green) |"
              echo ""
              echo "> This branch resolves from public npm, so \`${{ env.PKG }}\` installed and the build passed."
              echo "> In a real pipeline the malicious dependency ships **silently**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GREEN but COMPROMISED — '${{ env.PKG }}' installed from this branch's registry."
            exit 0
          fi

          if echo "$out" | grep -qiE "MALWARE_DETECTED|blocked by Chainguard for malware"; then
            {
              echo "| Result | ⛔ **BLOCKED** — HTTP 403 MALWARE_DETECTED (red = the win) |"
              echo ""
              echo "Chainguard withheld the package; the build fails loudly instead of shipping malware:"
              echo ""
              echo '```'
              echo "$out" | grep -iE "E403|403 |MALWARE_DETECTED|blocked by Chainguard" | head -4
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BLOCKED — Chainguard returned 403 MALWARE_DETECTED for '${{ env.PKG }}'."
            exit 1
          fi

          {
            echo "| Result | ❌ Failed WITHOUT a malware verdict (investigate) |"
            echo ""
            echo "> Not a provable malware block (ETARGET / 404 / auth). Use a package that is live on npm AND flagged."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Install failed without a Chainguard malware verdict."
          exit 1
